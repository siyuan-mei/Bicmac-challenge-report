train_cfg:
  crop_size: ${crop_size}
  batch_size: 2
  num_epochs: 200
  grad_accum_steps: 1
  save_freq: 10
  vis_epoch_interval: 10
  require_finetune_checkpoint: true
  loss_weights: null

data_cfg:
  num_samples: 2

optim_cfg:
  base_lr: 5.0e-5
  lr_min: 1.0e-5
  weight_decay: 0.0
  betas: [0.9, 0.95]
  scheduler: cosine
  warmup_epochs: 10
  start_factor: 0.01
  backbone_lr_mode: same
  backbone_lr_scale: 0.1
  layer_decay: 0.9
  grad_clip: 1.0
  scale_lr_by_world_size: true


val_cfg:
  start_val: 0
  val_freq: 10