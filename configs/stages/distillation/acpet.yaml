includes: [stages/finetune/spade]

model_cfg:
  distillation:
    weight: 0.05
    pool_size: 16
    levels: [0, 1, 2, 3, 4]

data_cfg:
  train_split: validation
  val_split: validation
  val_cv_fold: 4
  enforce_disjoint_splits: true
  num_samples: 4

train_cfg:
  num_epochs: 50
  save_freq: 5
  vis_epoch_interval: 5
  batch_size: 1

optim_cfg:
  base_lr: 1.0e-5
  lr_min: 0
  weight_decay: 0.0
  betas: [0.9, 0.95]
  scheduler: cosine
  warmup_epochs: 10
  start_factor: 0.01
  backbone_lr_mode: same
  backbone_lr_scale: 0.1
  layer_decay: 0.9
  grad_clip: 1.0
  scale_lr_by_world_size: true

