# Resolved configuration recorded by the training run "mednext_extra-pt_constant_lr1e4"
# (copied verbatim; only data_root was replaced by a placeholder).
# Learning rates are AFTER sqrt(world_size) scaling with world_size=4.
# Stage 1 (PET prior). Reproduce with configs/stages/pretrain/mednext_l-extra.yaml. model_cfg.net.condition_channels/mr_fusion_start/topogram_fusion_start are inert leftovers of an older revision (PET-only input).
seed: 42
smoke_no_write: false
crop_size:
- 128
- 128
- 128
model_cfg:
  net:
    type: MedNeXtv3
    features:
    - 32
    - 64
    - 128
    - 256
    - 512
    depths:
    - 2
    - 3
    - 4
    - 4
    - 4
    decoder_depths:
    - 2
    - 3
    - 4
    - 4
    kernel_sizes:
    - 3
    - 3
    - 3
    - 3
    - 3
    expansion:
    - 2
    - 3
    - 4
    - 4
    - 4
    skip_fusion: cat
    layer_scale_init: null
    use_checkpoint: false
    input_fusion: concat
    condition_channels: 32
    mr_fusion_start: 8
    topogram_fusion_start: 1
  family: mednext
  scale: large
data_cfg:
  data_root: ${oc.env:DATA_ROOT,data/bicmac}
  base_dataset: bicmac
  extra_dataset:
  - autopet
  - quadra_hc
  mixed_batch: true
  bicmac_mix_prob: 0.25
  psma_fraction: 0.0
  pet_to_nac_prob: 0.5
  train_split: train
  val_split: validation
  eval_split: challenge_val
  input_keys:
  - pet
  mask_keys:
  - prediction_mask
  - body_seg
  - organ_seg
  num_samples: 1
  use_extra_dataset: true
train_cfg:
  crop_size: ${crop_size}
  accelerator: gpu
  strategy: auto
  devices: 4
  precision: bf16-mixed
  batch_size: 4
  num_workers: 8
  prefetch_factor: 1
  num_epochs: 600
  grad_accum_steps: 1
  drop_last: false
  limit_train_batches: .inf
  max_steps: null
  save_freq: 25
  max_keep_ckpts: 1
  save_best:
  - 1-mae_mu_mean
  save_best_mode:
  - min
  use_wandb: true
  wandb_project: BICMAC
  vis_epoch_interval: 25
  save_visuals: true
  channels_last: true
  use_distributed_sampler: true
  require_finetune_checkpoint: false
  loss_weights:
    hu_mae: 1.0
    mu_mae_masked: 1.0
  world_size: 4
val_cfg:
  start_val: 0
  val_freq: 50
  patch_size: ${crop_size}
  sw_batch_size: 1
  overlap_ratio: 0.5
  infer_mode: gaussian
  sigma_scale: 0.125
  cache_roi_weight_map: true
  limit_val_batches: .inf
  limit_test_batches: .inf
  full_val_epoch: null
optim_cfg:
  optimizer: adamw
  base_lr: 0.0002
  lr_min: 1.0e-06
  weight_decay: 0.0
  betas:
  - 0.9
  - 0.95
  eps: 1.0e-08
  grad_clip: 1.0
  scheduler: null
  warmup_epochs: 10
  start_factor: 0.01
